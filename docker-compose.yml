# Ambiente completo de desenvolvimento: banco, API e site.
# Use .\iniciar.ps1 (ou: docker compose up -d --build) e abra http://localhost:3000
# Só o site fica exposto, e só nesta máquina. Banco e API ficam na rede interna do Docker.
name: taskgo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskgo_db
      POSTGRES_USER: taskgo_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (o iniciar.ps1 cria um para você)}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskgo_app -d taskgo_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/taskgo_db
      DB_USERNAME: taskgo_app
      DB_PASSWORD: ${DB_PASSWORD}
      # O site e a API chegam ao navegador pelo mesmo endereço (proxy do serviço web).
      TASKGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: lax
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      # Administradores: e-mails separados por vírgula (defina no .env).
      TASKGO_ADMIN_EMAILS: ${TASKGO_ADMIN_EMAILS:-}
      # Equipe de suporte: recebe os chamados de emergência em tempo real.
      TASKGO_SUPORTE_EMAILS: ${TASKGO_SUPORTE_EMAILS:-}
      # E-mail (recuperação de senha). Vazio = envio desligado.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      # Página do site que abre o link de recuperação (o servidor junta ?token=...).
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:3000/#/recuperar}
      # Pagamento simulado: Pix pelo simulador (serviço pix) e cartão simulado dentro da API.
      # simulado (Pix pelo simulador) ou asaas (pagamento real pelo Asaas; sandbox enquanto ASAAS_API_URL não for a de produção).
      TASKGO_PAGAMENTOS_MODO: ${TASKGO_PAGAMENTOS_MODO:-simulado}
      TASKGO_PAGAMENTOS_MODELO: ${TASKGO_PAGAMENTOS_MODELO:-retido}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PIX_API_URL: http://pix:3100
      PIX_WEBHOOK_TOKEN: ${PIX_WEBHOOK_TOKEN:?Defina PIX_WEBHOOK_TOKEN no arquivo .env (o iniciar.ps1 cria um para você)}
      # Entrar com Google: ID do cliente OAuth (vazio = botão escondido).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

  # Simulador da API Pix do Banco Inter (pagamentos/pix-simulador). Painel em http://localhost:3100
  pix:
    build: ./pagamentos/pix-simulador
    restart: unless-stopped
    environment:
      WEBHOOK_URL: http://api:8080/api/pagamentos/webhook/pix
      WEBHOOK_TOKEN: ${PIX_WEBHOOK_TOKEN}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - pix-dados:/app/data

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    # Só os arquivos do site; .env, backend e .git ficam fora do servidor.
    # As pastas são montadas direto do projeto: editou, é só recarregar a página.
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro

volumes:
  pix-dados:
  dados:
    # Mesmo volume do roteiro antigo do README: os dados já cadastrados continuam.
    name: taskgo-dev-db
