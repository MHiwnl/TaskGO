<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TaskGO — filme explicativo</title>
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;transition:none!important;animation:none!important}
  html,body{background:#000;overflow:hidden}
  #filme{position:relative;overflow:hidden;font-family:var(--texto)}
  /* os três fundos do site: preto, azul da marca com grão, branco (tema claro) */
  #filme.escuro{background:#000;--fg:#fff;--fg2:#a3a6b1;--ac:#8aa3ff;--ok:#4be0a0;--erro:#ff7d82;--linha:rgba(255,255,255,.17)}
  #filme.azul{background-color:#2b59ff;--fg:#fff;--fg2:#fff;--ac:#fff;--ok:#fff;--erro:#fff;--linha:rgba(255,255,255,.55)}
  #filme.claro{background:#fff;--fg:#000;--fg2:#5a5d68;--ac:#1a3fd6;--ok:#0a7a4b;--erro:#c4262e;--linha:rgba(0,0,0,.14)}
  .cap{position:absolute;inset:0;visibility:hidden;color:var(--fg)}
  /* título em duas vozes */
  #titulo{position:absolute;color:var(--fg);font-family:var(--mono);line-height:.98;z-index:5}
  #titulo .l{display:block;overflow:hidden}
  #titulo .l span{display:inline-block;white-space:nowrap}
  #titulo .l1{font-style:italic;font-weight:300;letter-spacing:-.02em}
  #titulo .l2{font-weight:700;letter-spacing:-.045em;padding-bottom:.06em}
  /* painel fixo */
  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;color:var(--fg);font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
  #hud .canto{position:absolute;border-color:var(--fg);border-style:solid;opacity:.85}
  #hud .regua{position:absolute;height:1px;background:var(--linha)}
  #hud .regua i{position:absolute;top:-6px;width:1px;height:13px;background:var(--fg);opacity:.7}
  #hud .regua b{position:absolute;left:0;top:-1px;height:3px;background:var(--ac)}
  #hud .bpm i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--ac);margin-right:.45em;vertical-align:-.05em}
  #hud .param{position:absolute;display:grid;grid-template-columns:auto auto;gap:.3em 1.6em;color:var(--fg2)}
  #hud .param b{color:var(--fg);font-weight:600}
  /* legenda gravada */
  #legenda{position:absolute;z-index:30;font-family:var(--texto);font-weight:500;line-height:1.3}
  #legenda span{padding:.12em .45em;-webkit-box-decoration-break:clone;box-decoration-break:clone;white-space:pre-line}
  #filme.escuro #legenda span{background:#fff;color:#000}
  #filme.azul #legenda span,#filme.claro #legenda span{background:#000;color:#fff}
  /* peças */
  .cartao{position:absolute;border:2px solid var(--fg);color:var(--fg);padding:.75em .95em;line-height:1.2}
  .cartao .t{font-family:var(--mono);font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-bottom:.4em}
  .chave{position:absolute;border:3px solid currentColor}
  .chave i{position:absolute;top:5px;bottom:5px;aspect-ratio:1;background:currentColor}
  svg.check path{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  canvas{position:absolute}
</style>
</head>
<body>
<div id="filme"></div>
<script src="timeline.js"></script>
<script src="duracoes.js"></script>
<script src="film.js"></script>
<script src="audio.js"></script>
</body>
</html>
