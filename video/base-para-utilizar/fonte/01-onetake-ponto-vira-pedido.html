<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>01 · onetake: um ponto vira o pedido</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: onetake (um elemento só atravessa o filme inteiro, sem cortes).
   Um ponto azul nasce, estica e vira a busca, o pedido sobe e chama três profissionais,
   um é escolhido (✓) e tudo volta ao ponto, que vira o símbolo da TaskGO. */
const { p, lerp, outExpo, outCubic, inOutCubic, outBack, mola, el, cores } = M;
let ponto, texto, cards = [], check, simbolo, marca, brilho;
const pros = [['Carlos', 'Eletricista', '4,9'], ['Ana', 'Eletricista', '5,0'], ['João', 'Eletricista', '4,8']];
window.CLIPE = {
  dur: 5,
  montar(palco) {
    palco.style.background = 'radial-gradient(ellipse at 50% 55%, #0a1440 0%, #000 60%)';
    brilho = el('div', 'position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px;border-radius:50%;background:radial-gradient(circle,rgba(43,89,255,.35),transparent 60%);filter:blur(20px)', palco);
    ponto = el('div', `position:absolute;left:960px;top:540px;height:40px;width:40px;border-radius:999px;background:${cores.azul};box-shadow:0 0 60px rgba(43,89,255,.8);display:flex;align-items:center;padding:0 40px;overflow:hidden`, palco);
    texto = el('div', 'font-size:44px;font-weight:500;white-space:nowrap;color:#fff', ponto);
    pros.forEach(([n, o, s]) => cards.push(el('div', `position:absolute;left:0;top:0;width:360px;height:150px;border-radius:28px;background:#0e0f14;border:1px solid #23263a;display:flex;align-items:center;gap:24px;padding:0 28px`, palco,
      `<div style="width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,${cores.azul},${cores.azulClaro});display:grid;place-items:center;font-size:38px;font-weight:700">${n[0]}</div>
       <div><div style="font-size:36px;font-weight:600">${n}</div><div style="font-size:26px;color:${cores.cinza}">${o} · ★ ${s}</div></div>`)));
    check = el('div', 'position:absolute;left:0;top:0;width:64px;height:64px', palco,
      `<svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="32" fill="${cores.verde}"/><path d="M18 33 L28 43 L47 22" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`);
    simbolo = el('img', 'position:absolute;left:960px;top:500px;width:180px;margin-left:-90px;margin-top:-90px', palco); simbolo.src = M.simbolo;
    marca = el('div', 'position:absolute;left:0;width:100%;top:640px;text-align:center;font-size:96px;font-weight:700;letter-spacing:-3px', palco, 'Task<span style="color:#2b59ff">GO</span>');
  },
  quadro(t) {
    /* 0–0.8 nasce o ponto (mola) · 0.8–1.5 estica em busca · 1.4–2.3 digita */
    const nasce = mola(t - 0.1, 2.2, 5);
    const estica = outExpo(p(t, 0.8, 1.5));
    const sobe = inOutCubic(p(t, 2.4, 3.0));
    const volta = inOutCubic(p(t, 3.8, 4.25));
    let w = lerp(40, 900, estica), h = lerp(40, 110, estica);
    w = lerp(w, 40, volta); h = lerp(h, 40, volta);
    const s = nasce * (1 - p(t, 4.2, 4.35));
    const y = lerp(540, 300, sobe) + (540 - lerp(540, 300, sobe)) * volta;
    ponto.style.width = w + 'px'; ponto.style.height = h + 'px';
    ponto.style.transform = `translate(${-w / 2}px,${-h / 2 + y - 540}px) scale(${s})`;
    const frase = 'Preciso de um eletricista';
    texto.textContent = frase.slice(0, Math.floor(frase.length * p(t, 1.4, 2.3))) + (t > 1.4 && t < 2.6 && Math.floor(t * 4) % 2 ? '|' : '');
    texto.style.opacity = 1 - p(t, 3.6, 3.8);
    brilho.style.transform = `scale(${0.4 + nasce * 0.6 + volta * 0.3})`; brilho.style.opacity = 0.6 + 0.4 * Math.sin(t * 2);
    /* 2.6–3.4 cards sobem em cascata; 3.3–3.7 o do meio é escolhido; 3.8 voltam para o ponto */
    cards.forEach((c, i) => {
      const k = mola(t - 2.6 - i * 0.09, 2.4, 6);
      const x = 960 + (i - 1) * 400 - 180, cy = 560;
      const esc = i === 1 ? 1 + 0.08 * outBack(p(t, 3.3, 3.6)) : 1 - 0.06 * p(t, 3.3, 3.6);
      const tx = lerp(x, 960 - 180, volta), ty = lerp(cy + (1 - k) * 220, y - 75, volta);
      c.style.transform = `translate(${tx}px,${ty}px) scale(${esc * (1 - volta * 0.9)})`;
      c.style.opacity = Math.min(1, k) * (1 - volta) * (i !== 1 ? 1 - 0.5 * p(t, 3.3, 3.6) : 1);
      c.style.borderColor = i === 1 && t > 3.35 ? cores.azul : '#23263a';
      c.style.boxShadow = i === 1 && t > 3.35 ? '0 0 50px rgba(43,89,255,.45)' : 'none';
    });
    const ck = p(t, 3.4, 3.75);
    check.style.transform = `translate(${960 + 140}px,${505 - 20}px) scale(${outBack(ck) * (1 - volta)})`;
    check.querySelector('path').style.strokeDashoffset = 1 - outCubic(p(t, 3.5, 3.8));
    /* 4.3–5 o ponto vira o símbolo e a marca */
    const fim = mola(t - 4.3, 2, 6);
    simbolo.style.transform = `scale(${Math.max(0, fim)}) rotate(${(1 - outExpo(p(t, 4.3, 4.9))) * -90}deg)`;
    simbolo.style.opacity = p(t, 4.3, 4.4);
    marca.style.opacity = p(t, 4.5, 4.75);
    marca.style.transform = `translateY(${(1 - outExpo(p(t, 4.5, 5))) * 40}px)`;
    marca.style.filter = `blur(${(1 - p(t, 4.5, 4.8)) * 12}px)`;
  }
};
</script></body></html>
