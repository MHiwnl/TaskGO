<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>filme 2 · zoom no bairro (20 s)</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Filme 2 · zoom contínuo de 20 s. Cada nível é um quadro 1920×1080 com origem O e escala K no mundo.
   A câmera é função de t (centro e zoom em log). Cada nível vai para a tela por matrix(a,0,0,a,sx,sy);
   quando um nível cobre a tela inteira, os de trás são escondidos. Nada acumula entre quadros. */
const { p, lerp, outExpo, outBack, inOutCubic, mola, el, cores, clamp } = M;
const lin = x => x, sine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const expo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const AZ = cores.azul, VD = cores.verde, CZ = cores.cinza;
const KC = 520 / 1920, KJ = 1 / 3, KA = 220 / 540;
const PINS_B = [{ x: 520, y: 330, t: 3.7 }, { x: 1380, y: 250, t: 4.0 }, { x: 1500, y: 760, t: 4.3 }, { x: 430, y: 790, t: 4.6 }, { x: 960, y: 540, t: 3.5 }];
const PINS_AV = [{ x: 640, y: 380, t: 13.2 }, { x: 1300, y: 700, t: 13.5 }];
const VISTAS = [   // [t, nível, zoom extra, curva de entrada]
  [0, 'cidade', 1, lin], [1.8, 'cidade', 1.25, sine], [3.4, 'bairro', 1, inOutCubic], [5.0, 'bairro', 1, lin],
  [6.2, 'casa', 1, expo], [7.2, 'janela', 1, inOutCubic], [8.2, 'janela', 1, lin], [9.2, 'app', 1, inOutCubic],
  [9.9, 'app', 1, lin], [10.9, 'card', 1, inOutCubic], [11.9, 'card', 1, lin], [13.0, 'avatar', 1, inOutCubic],
  [14.6, 'avatar', 1, lin], [15.8, 'cidade', 1, expo], [20, 'cidade', 1.1, sine]
];
const PALAVRAS = [['Perto', 4.4, 4.9], ['Rápido', 9.6, 10.2], ['Seguro', 11.1, 11.8]];
const NIV = {}, ORDEM = [], acesos = [];
let PALCO, KEYS = [], palavras = [], veu, marca;

function nivel(nome, pai, ax, ay, k, construir) {
  let O = { x: 0, y: 0 }, K = 1;
  if (pai) { const P = NIV[pai]; O = { x: P.O.x + P.K * (ax - 960 * k), y: P.O.y + P.K * (ay - 540 * k) }; K = P.K * k; }
  const div = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:none;overflow:hidden', PALCO);
  NIV[nome] = { O, K, div }; ORDEM.push(nome);
  construir(div);
}
function pinos(d, lista) {
  lista.forEach(q => { const e = el('div', `position:absolute;left:${q.x - 18}px;top:${q.y - 18}px;width:36px;height:36px;border-radius:50%;background:${AZ};box-shadow:0 0 40px rgba(43,89,255,.9);transform:scale(0)`, d); acesos.push({ e, t: q.t }); });
}
function mapa(d, seed, lista, rotulo) {
  const r = M.rnd(seed);
  let s = '<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><rect width="1920" height="1080" fill="#1a2748"/>';
  for (let i = 0; i < 13; i++) for (let j = 0; j < 9; j++) s += `<rect x="${i * 150 + 13}" y="${j * 120 + 13}" width="124" height="94" rx="6" fill="${r() < 0.12 ? '#0f2a22' : '#0b1222'}"/>`;
  s += '<rect x="1640" y="0" width="280" height="1080" fill="#0a2550"/></svg>';
  d.insertAdjacentHTML('beforeend', s);
  if (rotulo) d.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:60px;top:50px;font-size:52px;font-weight:700;color:#8aa3ff">${rotulo}</div>`);
  pinos(d, lista);
}
function cartao(d, ini, nome, prof, nota) {
  d.style.background = '#0e0f14';
  d.insertAdjacentHTML('beforeend', `
    <div style="position:absolute;left:110px;top:320px;width:440px;height:440px;border-radius:50%;background:linear-gradient(135deg,${AZ},${cores.azulClaro});text-align:center;line-height:440px;font-size:220px;font-weight:700">${ini}</div>
    <div style="position:absolute;left:760px;top:330px;font-size:130px;font-weight:700;white-space:nowrap">${nome}</div>
    <div style="position:absolute;left:760px;top:520px;font-size:70px;color:${CZ};white-space:nowrap">${prof}</div>
    <div style="position:absolute;left:760px;top:630px;font-size:70px;font-weight:600;color:${VD}">★ ${nota}</div>`);
}
function pintar(c) {
  const info = ORDEM.map(nome => { const L = NIV[nome], a = c.s * L.K; return { L, a, sx: 960 + (L.O.x - c.x) * c.s, sy: 540 + (L.O.y - c.y) * c.s }; });
  let corte = 0;   // o nível mais fundo que cobre a tela esconde todos os de trás
  for (let i = info.length - 1; i >= 0; i--) { const q = info[i]; if (q.sx <= 0 && q.sy <= 0 && q.sx + 1920 * q.a >= 1920 && q.sy + 1080 * q.a >= 1080) { corte = i; break; } }
  info.forEach((q, i) => {
    const vis = i >= corte && q.a > 1e-5 && q.sx < 1920 && q.sy < 1080 && q.sx + 1920 * q.a > 0 && q.sy + 1080 * q.a > 0;
    q.L.div.style.display = vis ? 'block' : 'none';
    if (vis) q.L.div.style.transform = `matrix(${q.a},0,0,${q.a},${q.sx},${q.sy})`;
  });
}
function camera(t) {
  const K = KEYS, n = K.length;
  if (t >= K[n - 1].t) return K[n - 1];
  let i = 1; while (t > K[i].t) i++;
  const a = K[i - 1], b = K[i], k = b.e(p(t, a.t, b.t));
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), s: Math.exp(lerp(Math.log(a.s), Math.log(b.s), k)) };
}

window.CLIPE = {
  dur: 20,
  eventos: [
    { t: 0, kind: 'rise', x: 960 }, { t: 1.8, kind: 'dive', x: 960 },
    { t: 3.7, kind: 'land', x: 520 }, { t: 4.0, kind: 'land', x: 1380 }, { t: 4.3, kind: 'land', x: 1500 }, { t: 4.6, kind: 'land', x: 430 },
    { t: 4.4, kind: 'word', x: 960 }, { t: 5.0, kind: 'whip', x: 960 }, { t: 6.2, kind: 'open', x: 960 },
    { t: 7.6, kind: 'rise', x: 960 }, { t: 8.2, kind: 'dive', x: 960 }, { t: 9.5, kind: 'tap', x: 380 },
    { t: 9.6, kind: 'word', x: 960 }, { t: 9.9, kind: 'open', x: 380 }, { t: 11.1, kind: 'word', x: 960 },
    { t: 11.9, kind: 'dive', x: 330 }, { t: 13.2, kind: 'land', x: 640 }, { t: 13.5, kind: 'land', x: 1300 },
    { t: 14.6, kind: 'whip', x: 960 }, { t: 16.0, kind: 'hit', x: 960 }
  ],
  montar(palco) {
    PALCO = palco;
    // cidade: Recife de noite, de cima (nível raiz)
    nivel('cidade', null, 0, 0, 1, d => {
      d.style.background = 'linear-gradient(#04060d,#0a1228)';
      const r = M.rnd(5);
      let s = '<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><path d="M-40 360 C420 300 700 640 1040 600 S1560 760 1980 700" fill="none" stroke="#0b1d44" stroke-width="150" stroke-linecap="round"/>';
      for (let x = 0; x <= 1920; x += 96) s += `<line x1="${x}" y1="0" x2="${x}" y2="1080" stroke="#16213f" stroke-width="2"/>`;
      for (let y = 0; y <= 1080; y += 72) s += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="#16213f" stroke-width="2"/>`;
      for (let i = 0; i < 400; i++) s += `<circle cx="${(r() * 1920).toFixed(1)}" cy="${(r() * 1080).toFixed(1)}" r="${(1.5 + r() * 2).toFixed(1)}" fill="${r() < 0.6 ? '#ffd98a' : '#8aa3ff'}" opacity="${(0.35 + r() * 0.6).toFixed(2)}"/>`;
      d.innerHTML = s + `<circle cx="1180" cy="610" r="22" fill="${AZ}" opacity="0.35"/><circle cx="1180" cy="610" r="9" fill="${AZ}"/></svg>`;
    });
    // bairro: entra no ponto azul da cidade (1180, 610)
    nivel('bairro', 'cidade', 1180, 610, 0.1, d => mapa(d, 8, PINS_B, 'Boa Viagem'));
    // casa: o centro do bairro
    nivel('casa', 'bairro', 960, 540, 0.1, d => {
      d.style.background = 'linear-gradient(#070b1c,#1c1a34)';
      d.innerHTML = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">
        <defs><linearGradient id="jan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#7a4316"/></linearGradient></defs>
        <rect x="300" y="380" width="1320" height="700" fill="#1a2030"/><polygon points="260,400 960,140 1660,400" fill="#0d1222"/>
        <rect x="380" y="470" width="200" height="150" fill="#2a2440"/><rect x="1340" y="470" width="200" height="150" fill="#2a2440"/>
        <rect x="860" y="800" width="200" height="280" fill="#0a0e18"/>
        <rect x="720" y="405" width="480" height="270" fill="url(#jan)"/><rect x="720" y="405" width="480" height="270" fill="none" stroke="#0a0e18" stroke-width="18"/>
        <line x1="960" y1="405" x2="960" y2="675" stroke="#0a0e18" stroke-width="12"/></svg>`;
    });
    // janela: a sala com a mão segurando o celular (o celular é o nível seguinte)
    nivel('janela', 'casa', 960, 540, 0.25, d => {
      d.style.background = 'radial-gradient(900px 600px at 30% 20%,#3a2412,#120e18 70%)';
      d.innerHTML = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">
        <rect x="0" y="880" width="1920" height="200" fill="#0b0810"/>
        <rect x="624" y="344" width="672" height="392" rx="40" fill="#050505" stroke="#2a2d3d" stroke-width="3"/>
        <path d="M430 1080 C470 900 560 790 680 760 L800 735 C850 728 880 770 860 806 L1000 1080 Z" fill="#1d1521"/></svg>`;
    });
    // tela do app: encaixa na tela do celular (640×360)
    nivel('app', 'janela', 960, 540, KJ, d => {
      d.style.background = '#05070f';
      d.insertAdjacentHTML('beforeend', `
        <div style="position:absolute;left:120px;top:60px;font-size:64px;font-weight:700">Task<span style="color:${AZ}">GO</span></div>
        <div style="position:absolute;left:120px;top:150px;width:1680px;height:100px;border-radius:50px;background:#0e0f14;border:2px solid #23263a;box-sizing:border-box;font-size:44px;line-height:96px;padding-left:56px">eletricista</div>
        <div style="position:absolute;left:120px;top:270px;font-size:30px;color:${CZ}">Profissionais disponíveis agora</div>`);
      [[120, 'C', 'Carlos Andrade', 'Eletricista · Boa Viagem', '4,9'], [700, 'A', 'Ana Beatriz', 'Eletricista · Boa Viagem', '5,0'], [1280, 'R', 'Roberto Farias', 'Eletricista · Pina', '4,8']].forEach(([x, ini, nome, prof, nota]) => {
        const w = el('div', `position:absolute;left:${x}px;top:330px;width:1920px;height:1080px;transform-origin:0 0;transform:scale(${KC})`, d);
        cartao(w, ini, nome, prof, nota);
      });
    });
    // cartão do Carlos: o cartão da tela do app, em tamanho de quadro
    nivel('card', 'app', 380, 476.25, KC, d => cartao(d, 'C', 'Carlos Andrade', 'Eletricista · Boa Viagem', '4,9'));
    // avatar: o círculo do avatar mostra outra vista do bairro (o loop)
    nivel('avatar', 'card', 330, 540, KA, d => {
      d.style.background = '#0e0f14';
      const m = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;clip-path:circle(540px at 960px 540px)', d);
      mapa(m, 22, PINS_AV);
      el('div', `position:absolute;left:420px;top:0;width:1080px;height:1080px;border-radius:50%;border:14px solid ${AZ};box-sizing:border-box`, d);
    });
    NIV.avatar.div.style.opacity = 0;

    KEYS = VISTAS.map(([t, n, z, e]) => { const L = NIV[n]; return { t, x: L.O.x + L.K * 960, y: L.O.y + L.K * 540, s: z / L.K, e }; });

    palavras = PALAVRAS.map(([w]) => el('div', 'position:absolute;left:0;top:740px;width:1920px;text-align:center;font-size:230px;font-weight:700;letter-spacing:-8px;opacity:0', palco, `${w}<span style="color:${AZ}">.</span>`));
    veu = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;opacity:0', palco);
    marca = el('div', 'position:absolute;left:0;top:300px;width:1920px;text-align:center;opacity:0', palco, `<img src="${M.simbolo}" style="width:190px;display:block;margin:0 auto 24px"><div style="font-size:230px;font-weight:700;letter-spacing:-8px">Task<span style="color:${AZ}">GO</span></div>`);
  },
  quadro(t) {
    pintar(camera(t));
    NIV.avatar.div.style.opacity = p(t, 11.8, 12.2);
    acesos.forEach(q => { q.e.style.transform = `scale(${Math.max(0, mola(t - q.t, 2.4, 7))})`; });
    palavras.forEach((e, i) => {
      const [, a, b] = PALAVRAS[i];
      e.style.opacity = Math.min(p(t, a, a + 0.12), 1 - p(t, b - 0.15, b));
      e.style.transform = `scale(${lerp(1.2, 1, outBack(p(t, a, a + 0.45)))})`;
    });
    veu.style.opacity = 0.7 * p(t, 15.8, 16.3);
    marca.style.opacity = p(t, 15.9, 16.3);
    marca.style.transform = `translateY(${(1 - outExpo(p(t, 16.0, 16.8))) * 40}px)`;
  }
};
</script></body></html>
