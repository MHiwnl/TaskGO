<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>49 · linhas de fluxo convergem para a marca</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: flow-field (partículas com rastro seguem um campo invisível). Aqui a trajetória é uma função fechada de t:
   cada partícula sai da borda com semente fixa, faz uma curva e converge ao centro, onde o símbolo se forma. Sem estado acumulado. */
const { p, lerp, outExpo, inOutCubic, mola, el, cores } = M;
const N = 260, RASTRO = 26, PASSO = 0.028, C = { x: 960, y: 480 };
const rnd = M.rnd(49);
const parts = [];
let cv, ctx, simbolo, marca;
function pos(q, t) {
  const u = inOutCubic(Math.min(1, Math.max(0, (t - q.d) / q.dur)));
  const bx = q.sx + (C.x - q.sx) * u, by = q.sy + (C.y - q.sy) * u;
  const env = Math.sin(u * Math.PI * 1.5 + q.ph) * q.amp * (1 - u);
  return [bx + q.px * env, by + q.py * env];
}
window.CLIPE = {
  dur: 5,
  montar(palco) {
    palco.style.background = 'radial-gradient(ellipse at 50% 45%, #061033 0%, #000 70%)';
    cv = el('canvas', 'position:absolute;left:0;top:0', palco);
    cv.width = M.W; cv.height = M.H; ctx = cv.getContext('2d');
    for (let i = 0; i < N; i++) {
      const a = rnd() * Math.PI * 2, R = 1100;
      const sx = C.x + Math.cos(a) * R, sy = C.y + Math.sin(a) * R;
      const dx = C.x - sx, dy = C.y - sy, L = Math.hypot(dx, dy);
      parts.push({ sx, sy, px: -dy / L, py: dx / L, d: rnd() * 1.6, dur: 1.4 + rnd() * 0.8, ph: rnd() * 6.28, amp: 120 + rnd() * 160, azul: rnd() < 0.3 });
    }
    simbolo = el('img', 'position:absolute;left:960px;top:480px;width:200px;margin-left:-100px;margin-top:-100px;opacity:0', palco); simbolo.src = M.simbolo;
    marca = el('div', 'position:absolute;left:0;width:100%;top:760px;text-align:center;font-size:120px;font-weight:700;letter-spacing:-4px;opacity:0', palco, 'Task<span style="color:#2b59ff">GO</span>');
  },
  quadro(t) {
    ctx.clearRect(0, 0, M.W, M.H);
    /* rastros: cada partícula desenha os últimos passos da própria trajetória, mais fortes perto da cabeça */
    for (const q of parts) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = q.azul ? cores.azul : '#ffffff';
      for (let k = RASTRO - 1; k > 0; k--) {
        const [x1, y1] = pos(q, t - k * PASSO), [x2, y2] = pos(q, t - (k - 1) * PASSO);
        const tt = t - k * PASSO;
        if (tt < q.d) continue;
        ctx.globalAlpha = 0.5 * (1 - k / RASTRO) * Math.min(1, (t - q.d) * 4);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      const [hx, hy] = pos(q, t);
      ctx.globalAlpha = 0.9 * (1 - p(t, 3.0, 3.4));
      ctx.fillStyle = q.azul ? cores.azul : '#fff';
      ctx.beginPath(); ctx.arc(hx, hy, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    /* 3,0–3,4 as linhas se fecham no centro (anel de luz), 3,2–4,0 o símbolo surge com mola */
    const anel = p(t, 3.0, 3.8);
    if (anel > 0 && anel < 1) {
      ctx.globalAlpha = 0.6 * (1 - anel);
      ctx.strokeStyle = cores.azul; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(C.x, C.y, 40 + 260 * outExpo(anel), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    simbolo.style.opacity = p(t, 3.2, 3.6);
    simbolo.style.transform = `scale(${lerp(0.3, 1, mola(t - 3.2, 2.2, 5))})`;
    marca.style.opacity = p(t, 4.0, 4.5);
    marca.style.transform = `translateY(${(1 - outExpo(p(t, 4.0, 4.8))) * 40}px)`;
  }
};
</script></body></html>
