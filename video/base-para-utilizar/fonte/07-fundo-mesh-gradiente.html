<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>07 · fundo mesh</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: fundo em malha animada. Seis manchas radiais se movem e se misturam (screen), um grão
   sutil treme por cima e o título "Serviços perto de você" entra palavra a palavra; no fim, o símbolo e o wordmark. */
const { p, lerp, outExpo, inOutCubic, mola, el, cores, rnd } = M;
let manchas = [], grao, palavras = [], spot, simb, marca;
window.CLIPE = {
  dur: 5,
  montar(palco) {
    palco.style.background = '#000';
    const malha = el('div', 'position:absolute;inset:0;filter:blur(30px);mix-blend-mode:screen', palco);
    const cs = [cores.azul, cores.azulEscuro, cores.verde, cores.azulClaro, cores.azul, cores.verde];
    manchas = cs.map((c, k) => {
      const s = 900 + (k % 3) * 220;
      return { e: el('div', `position:absolute;left:0;top:0;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,${c} 0%,rgba(0,0,0,0) 66%);opacity:0`, malha), s, k };
    });
    /* grão: ruído semeado, repetido e deslocado em passos (sem Math.random) */
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const cx = cv.getContext('2d'), im = cx.createImageData(256, 256), r = rnd(11);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    cx.putImageData(im, 0, 0);
    grao = el('div', `position:absolute;left:-256px;top:-256px;width:2560px;height:1640px;opacity:.13;mix-blend-mode:overlay;background-image:url(${cv.toDataURL()});background-size:256px 256px`, palco);
    spot = el('div', 'position:absolute;left:260px;top:200px;width:1400px;height:680px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.2),rgba(255,255,255,0) 62%);opacity:0', palco);
    const titulo = el('div', 'position:absolute;left:0;width:100%;top:440px;text-align:center;font-size:150px;font-weight:700;letter-spacing:-5px;line-height:1.1', palco);
    ['Serviços', 'perto', 'de', 'você'].forEach(w => palavras.push(el('span', `display:inline-block;white-space:pre;margin:0 14px;${w === 'perto' ? 'color:' + cores.azul : ''}`, titulo, w)));
    simb = el('img', 'position:absolute;left:840px;top:220px;width:240px;height:240px;opacity:0', palco);
    simb.src = M.simbolo;
    marca = el('div', 'position:absolute;left:0;width:100%;top:530px;text-align:center;font-size:150px;font-weight:700;letter-spacing:-5px;opacity:0', palco, 'Task<span style="color:#2b59ff">GO</span>');
  },
  quadro(t) {
    /* 0–0.8 manchas acendem e orbitam · 1.0–1.9 título entra · 3.7–4.3 título sai · 4.2–5 símbolo e wordmark */
    const sai = inOutCubic(p(t, 3.7, 4.3));
    manchas.forEach(m => {
      const a = t * (0.3 + m.k * 0.07) * (m.k % 2 ? 1 : -1) + m.k * 1.3;
      const x = 960 + Math.cos(a) * 560, y = 540 + Math.sin(a * 1.3 + m.k) * 340;
      m.e.style.transform = `translate(${(x - m.s / 2).toFixed(1)}px,${(y - m.s / 2).toFixed(1)}px) scale(${(1 + 0.1 * Math.sin(t * 0.9 + m.k)).toFixed(4)})`;
      m.e.style.opacity = (0.85 * p(t, 0, 0.8)).toFixed(3);
    });
    grao.style.transform = `translate(${-(Math.floor(t * 24) % 8) * 16}px,${-(Math.floor(t * 24) % 5) * 12}px)`;
    const e0 = outExpo(p(t, 0.8, 1.6));
    spot.style.opacity = (0.9 * e0 * (1 - sai)).toFixed(3);
    spot.style.transform = `scale(${(0.8 + 0.2 * e0).toFixed(4)})`;
    palavras.forEach((s, i) => {
      const k = p(t, 1.0 + i * 0.14, 1.9 + i * 0.14), e = outExpo(k);
      s.style.transform = `translateY(${((1 - e) * 90 - sai * 120).toFixed(1)}px) scale(${lerp(1.25, 1, e).toFixed(4)})`;
      s.style.opacity = (Math.min(1, k * 2.5) * (1 - sai)).toFixed(3);
      s.style.filter = `blur(${((1 - e) * 18 + sai * 14).toFixed(2)}px)`;
    });
    const sm = mola(t - 4.2, 2, 6);
    simb.style.opacity = p(t, 4.2, 4.4).toFixed(3);
    simb.style.transform = `scale(${Math.max(0, sm).toFixed(4)}) rotate(${((1 - outExpo(p(t, 4.2, 4.9))) * -120).toFixed(2)}deg)`;
    marca.style.opacity = p(t, 4.5, 4.8).toFixed(3);
    marca.style.transform = `translateY(${((1 - mola(t - 4.5, 2, 6)) * 60).toFixed(1)}px)`;
  }
};
</script></body></html>
