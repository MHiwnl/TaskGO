<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>09 · transição de página</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: page transition com elemento compartilhado. O card da Ana, na lista de profissionais,
   cresce até virar a tela de perfil (morph de posição, tamanho e raio) e o conteúdo entra em cascata.
   Um círculo preto se expande a partir do centro, apaga a tela e revela a marca. */
const { p, lerp, clamp, outExpo, outCubic, inOutCubic, outBack, mola, el, cores } = M;
const SW = 436, SH = 916;                 // tela do celular, em pixels internos
const HX = 24, HW = 388, HH = 170, HY = 430; // card de destaque na lista (posição na tela)
let palco, ph, sc, titulo, sub, c0, c2, hero, fundo, capa, av, nomeL, metaL, nomeP, metaP, anel, corpo = [];
let blobs = [], fundoWipe, anelWipe, simb, marca, letras = [];
const morf = t => inOutCubic(p(t, 1.9, 2.8));   // posição do morph
const tam = t => outBack(p(t, 1.9, 3.0), 1.1);  // tamanho com leve overshoot

function cartao(pai, n, prof, nota, top) {
  const box = el('div', `position:absolute;left:${HX}px;top:${top}px;width:${HW}px;height:${HH}px`, pai);
  const f = el('div', `position:absolute;inset:0;border-radius:inherit;background:#13151d;border:1px solid #23263a`, box);
  const a = el('div', `position:absolute;left:22px;top:43px;width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,${cores.azul},${cores.azulClaro});display:grid;place-items:center;font-size:34px;font-weight:700`, box, n[0]);
  const nm = el('div', 'position:absolute;left:128px;top:42px;font-size:32px;font-weight:700;white-space:nowrap', box, n);
  const mt = el('div', `position:absolute;left:128px;top:92px;font-size:22px;color:${cores.cinza};white-space:nowrap`, box, `${prof} · ★ ${nota}`);
  return { box, f, a, nm, mt };
}

window.CLIPE = {
  dur: 5,
  montar(palco_) {
    palco = palco_;
    palco.style.background = 'radial-gradient(ellipse at 50% 40%, #0b1a4a 0%, #000 65%)';
    const r = M.rnd(9);
    for (let i = 0; i < 3; i++) {
      const b = el('div', `position:absolute;left:${(300 + r() * 1300).toFixed(0)}px;top:${(150 + r() * 780).toFixed(0)}px;width:${520 + r() * 300}px;height:${520 + r() * 300}px;border-radius:50%;background:${cores.azul};opacity:.2;filter:blur(90px)`, palco);
      blobs.push(b);
    }
    ph = el('div', 'position:absolute;left:730px;top:70px;width:460px;height:940px;border-radius:64px;background:linear-gradient(160deg,#1d2030,#08090e);box-shadow:0 50px 140px rgba(43,89,255,.35),inset 0 0 0 2px #2a2e40', palco);
    sc = el('div', 'position:absolute;left:12px;top:12px;width:436px;height:916px;border-radius:52px;overflow:hidden;background:#07080c', ph);
    titulo = el('div', 'position:absolute;left:24px;top:84px;font-size:44px;font-weight:700;letter-spacing:-1px;white-space:nowrap', sc, 'Eletricistas');
    sub = el('div', `position:absolute;left:24px;top:146px;font-size:24px;color:${cores.cinza};white-space:nowrap`, sc, 'Perto de você · 3 resultados');
    c0 = cartao(sc, 'Carlos', 'Eletricista', '4,9', 230);
    c2 = cartao(sc, 'João', 'Eletricista', '4,8', 630);
    hero = cartao(sc, 'Ana', 'Eletricista', '5,0', HY);
    fundo = hero.f; av = hero.a; nomeL = hero.nm; metaL = hero.mt;
    capa = el('div', `position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,${cores.azul},${cores.azulEscuro} 50%,#0a0c14);opacity:0`, hero.box);
    hero.box.insertBefore(capa, av);
    nomeP = el('div', 'position:absolute;left:0;top:300px;width:436px;text-align:center;font-size:38px;font-weight:700;opacity:0', hero.box, 'Ana Souza');
    metaP = el('div', `position:absolute;left:0;top:352px;width:436px;text-align:center;font-size:22px;color:#c9d5ff;opacity:0`, hero.box, `Eletricista · ★ 5,0 · 128 serviços`);
    anel = el('div', `position:absolute;border:3px solid ${cores.azul};border-radius:50%;box-shadow:0 0 30px ${cores.azul};opacity:0`, sc);
    corpo.push(el('div', 'position:absolute;left:24px;top:500px;width:388px;font-size:22px;line-height:1.5;color:#b8bcc9;opacity:0', sc, 'Instalação, reparo e troca de chuveiro, tomada e quadro de luz. Atende a região em até um dia.'));
    corpo.push(el('div', 'position:absolute;left:24px;top:620px;width:388px;display:flex;gap:12px;opacity:0', sc, ['Chuveiro', 'Tomada', 'Quadro'].map(c => `<span style="padding:0 22px;height:46px;line-height:46px;border-radius:23px;border:1px solid ${cores.azul};color:#8aa3ff;font-size:22px;white-space:nowrap">${c}</span>`).join('')));
    corpo.push(el('div', 'position:absolute;left:24px;top:700px;width:388px;display:flex;gap:12px;opacity:0', sc, [['128', 'serviços'], ['5,0', 'nota média'], ['2 km', 'de você']].map(([a, b]) => `<div style="flex:1;height:110px;border-radius:20px;background:#13151d;display:grid;align-content:center;text-align:center"><div style="font-size:34px;font-weight:700">${a}</div><div style="font-size:20px;color:${cores.cinza}">${b}</div></div>`).join('')));
    corpo.push(el('div', `position:absolute;left:24px;top:830px;width:388px;height:72px;border-radius:36px;background:${cores.azul};display:grid;place-items:center;font-size:26px;font-weight:700;opacity:0`, sc, 'Pedir orçamento'));
    fundoWipe = el('div', 'position:absolute;inset:0;background:#000', palco);
    anelWipe = el('div', `position:absolute;border:5px solid ${cores.azul};border-radius:50%;box-shadow:0 0 60px ${cores.azul};opacity:0`, palco);
    simb = el('img', 'position:absolute;left:875px;top:360px;width:170px', fundoWipe); simb.src = M.simbolo;
    marca = el('div', 'position:absolute;left:0;width:100%;top:580px;text-align:center;font-size:150px;font-weight:700;letter-spacing:-5px;white-space:nowrap', fundoWipe);
    'TaskGO'.split('').forEach((ch, i) => letras.push(el('span', `display:inline-block;color:${i > 3 ? cores.azul : '#fff'}`, marca, ch)));
  },
  quadro(t) {
    blobs.forEach((b, i) => { b.style.transform = `translate(-50%,-50%) translate(${(Math.sin(t * 0.5 + i * 2) * 90).toFixed(1)}px,${(Math.cos(t * 0.4 + i) * 60).toFixed(1)}px)`; });
    /* 0–0.8 o celular entra com mola · 0.25–0.5 cards sobem em cascata · 1.1–1.45 toque no card · 1.9–2.8 morph */
    const sai = p(t, 3.0, 3.4);
    const ent = outBack(p(t, 0, 0.6), 1.2);
    ph.style.opacity = clamp(p(t, 0, 0.3)) * (1 - sai);
    ph.style.transform = `perspective(1400px) rotateX(${((1 - outCubic(p(t, 0, 0.8))) * 18).toFixed(2)}deg) scale(${(lerp(0.82, 1, ent) * (1 - 0.08 * sai)).toFixed(4)})`;
    /* lista: cabeçalho e cards laterais saem durante o morph */
    const kt = outExpo(p(t, 0.05, 0.6));
    titulo.style.opacity = kt * (1 - p(t, 1.8, 2.2));
    titulo.style.transform = `translateY(${(1 - kt) * -40}px)`;
    sub.style.opacity = kt * (1 - p(t, 1.8, 2.2));
    const m = morf(t), g = tam(t), outro = p(t, 1.9, 2.4);
    const k0 = mola(t - 0.25, 2.2, 6), k2 = mola(t - 0.49, 2.2, 6);
    c0.box.style.transform = `translateY(${((1 - k0) * 180 - m * 160).toFixed(1)}px)`;
    c0.box.style.opacity = clamp(k0) * (1 - outro);
    c2.box.style.transform = `translateY(${((1 - k2) * 180 + m * 200).toFixed(1)}px)`;
    c2.box.style.opacity = clamp(k2) * (1 - outro);
    /* card da Ana: entra, toca (pressiona), depois vira a tela de perfil */
    const kh = mola(t - 0.37, 2.2, 6);
    const press = Math.sin(Math.PI * p(t, 1.1, 1.45)) * 0.04;
    const y = lerp(HY + (1 - kh) * 180, 0, m);
    const w = lerp(HW, SW, g), h = lerp(HH, 470, g), rad = lerp(28, 0, m);
    const vel = Math.abs(morf(t + 0.02) - morf(t - 0.02)) / 0.04; // velocidade do morph vira desfoque de movimento
    hero.box.style.left = lerp(HX, 0, m).toFixed(1) + 'px';
    hero.box.style.top = y.toFixed(1) + 'px';
    hero.box.style.width = w.toFixed(1) + 'px';
    hero.box.style.height = h.toFixed(1) + 'px';
    hero.box.style.borderRadius = rad.toFixed(1) + 'px';
    hero.box.style.overflow = 'hidden';
    hero.box.style.opacity = clamp(kh);
    hero.box.style.transform = `scale(${(1 - press).toFixed(4)})`;
    hero.box.style.filter = `blur(${Math.min(5, vel * 1.2).toFixed(2)}px)`;
    fundo.style.opacity = 1 - m;
    capa.style.opacity = m;
    av.style.left = lerp(22, 133, m).toFixed(1) + 'px';
    av.style.top = lerp(43, 110, m).toFixed(1) + 'px';
    av.style.width = av.style.height = lerp(84, 170, m).toFixed(1) + 'px';
    av.style.fontSize = lerp(34, 64, m).toFixed(1) + 'px';
    nomeL.style.opacity = 1 - p(t, 1.9, 2.25);
    metaL.style.opacity = 1 - p(t, 1.9, 2.25);
    nomeP.style.opacity = p(t, 2.3, 2.8);
    nomeP.style.transform = `translateY(${((1 - outCubic(p(t, 2.3, 2.9))) * 24).toFixed(1)}px)`;
    metaP.style.opacity = p(t, 2.4, 2.9);
    metaP.style.transform = `translateY(${((1 - outCubic(p(t, 2.4, 3.0))) * 24).toFixed(1)}px)`;
    /* toque: anel que se expande a partir do centro do card */
    const rk = outExpo(p(t, 1.2, 1.9)), rr = 40 + 260 * rk;
    anel.style.left = (218 - rr).toFixed(1) + 'px';
    anel.style.top = (515 - rr).toFixed(1) + 'px';
    anel.style.width = anel.style.height = (2 * rr).toFixed(1) + 'px';
    anel.style.opacity = (1 - p(t, 1.2, 1.9)) * 0.9;
    /* 2.45–3.1 conteúdo do perfil entra em cascata */
    corpo.forEach((c, i) => {
      const k = mola(t - (2.45 + i * 0.08), 2.2, 6);
      c.style.transform = `translateY(${((1 - k) * 90).toFixed(1)}px)`;
      c.style.opacity = clamp(k);
    });
    corpo[3].style.boxShadow = `0 0 ${(20 + 20 * Math.sin(t * 4) * p(t, 3.0, 3.4)).toFixed(1)}px rgba(43,89,255,.6)`;
    /* 3.2–4.1 círculo preto apaga a tela; a borda azul acompanha o raio */
    const R = 1250 * inOutCubic(p(t, 3.2, 4.1));
    fundoWipe.style.clipPath = `circle(${R.toFixed(1)}px at 50% 50%)`;
    anelWipe.style.left = (960 - R).toFixed(1) + 'px';
    anelWipe.style.top = (540 - R).toFixed(1) + 'px';
    anelWipe.style.width = anelWipe.style.height = (2 * R).toFixed(1) + 'px';
    anelWipe.style.opacity = p(t, 3.2, 3.3) * (1 - p(t, 4.1, 4.3));
    /* 3.7–5 símbolo com giro, letras da marca em cascata */
    const sk = outBack(p(t, 3.7, 4.25), 1.4);
    simb.style.transform = `scale(${Math.max(0, sk).toFixed(4)}) rotate(${((1 - outExpo(p(t, 3.7, 4.5))) * -160).toFixed(1)}deg)`;
    simb.style.filter = `drop-shadow(0 0 ${(30 + 14 * Math.sin(t * 3)).toFixed(1)}px ${cores.azul})`;
    letras.forEach((s, i) => {
      const k = mola(t - (3.95 + i * 0.05), 2.2, 6);
      s.style.transform = `translateY(${((1 - k) * 120).toFixed(1)}px)`;
      s.style.opacity = clamp(k);
      s.style.filter = `blur(${((1 - clamp(k)) * 16).toFixed(1)}px)`;
    });
    marca.style.textShadow = `0 0 ${(30 * p(t, 4.0, 4.6)).toFixed(1)}px rgba(43,89,255,.5)`;
  }
};
</script></body></html>
