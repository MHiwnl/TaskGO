<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>25 · text echo trail</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: text-echo-trail (awesome-ai-motion nº 497). "Chegou rápido" entra da esquerda com 6 cópias
   atrasadas 0.045 s (opacidade 0.5 caindo com a ordem). As cópias somem quando o movimento para. No fim a frase
   sai para a direita com o mesmo rastro e a marca TaskGO aparece. */
const { p, lerp, outCubic, inCubic, inOutCubic, el, cores } = M;
const css = 'position:absolute;left:0;width:100%;top:400px;text-align:center;font-size:180px;font-weight:700;letter-spacing:-6px;white-space:nowrap';
let camadas = [], sublinha, marca, tag, grade;
const posicao = tt => (tt <= 0 ? -1000 : -1000 * (1 - outCubic(p(tt, 0.2, 1.1))) + 1000 * inOutCubic(p(tt, 3.5, 4.1)));
window.CLIPE = {
  dur: 5,
  montar(palco) {
    grade = el('div', 'position:absolute;inset:-120px;opacity:.1;background-image:linear-gradient(90deg,#2b59ff 2px,transparent 2px),linear-gradient(#2b59ff 2px,transparent 2px);background-size:120px 120px', palco);
    for (let k = 6; k >= 0; k--) camadas[k] = el('div', css, palco, 'Chegou rápido');
    sublinha = el('div', `position:absolute;left:50%;top:640px;height:8px;width:900px;margin-left:-450px;background:${cores.azul};border-radius:4px;transform-origin:0 50%;transform:scaleX(0)`, palco);
    marca = el('div', 'position:absolute;left:0;width:100%;top:420px;text-align:center;font-size:200px;font-weight:700;letter-spacing:-8px;opacity:0;white-space:nowrap', palco, 'Task<span style="color:#2b59ff">GO</span>');
    tag = el('div', `position:absolute;left:0;width:100%;top:730px;text-align:center;font-size:48px;font-weight:500;color:${cores.cinza};opacity:0`, palco, 'Marketplace de serviços locais');
  },
  quadro(t) {
    grade.style.transform = `translate(${-((t * 60) % 120)}px,${-((t * 30) % 120)}px)`;
    const drift = 1 + 0.03 * p(t, 1.1, 3.5);
    camadas.forEach((el_, k) => {
      const tt = t - k * 0.045;
      const ativa = k === 0 || (tt > 0.2 && tt < 1.3) || (tt > 3.5 && tt < 4.4);
      el_.style.transform = `translateX(${posicao(tt)}px) scale(${drift})`;
      el_.style.opacity = ativa ? (k === 0 ? 1 : 0.5 * (1 - k / 7)) : 0;
    });
    sublinha.style.transform = `scaleX(${outCubic(p(t, 1.4, 1.9)) * (1 - p(t, 3.3, 3.6))})`;
    marca.style.opacity = p(t, 3.9, 4.3);
    marca.style.transform = `scale(${lerp(1.15, 1, outCubic(p(t, 3.9, 4.4)))})`;
    tag.style.opacity = p(t, 4.4, 4.8);
  }
};
</script></body></html>
