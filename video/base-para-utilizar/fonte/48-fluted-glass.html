<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>48 · vidro canelado sobre a cena</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: fluted-glass (18 canelas verticais que deslocam e escurecem a imagem atrás, em deriva lenta).
   Aqui: cards de profissionais atrás de um vidro canelado (canvas fatiado por coluna); o vidro se abre e a marca aparece nítida. */
const { p, lerp, outExpo, inOutCubic, outBack, el, cores } = M;
const W = 1920, H = 1080, CANELAS = 18, DESLOC = 0.025, DERIVA = 0.04;
const perfil = [['Carlos', 'Eletricista', '4,9'], ['Ana', 'Diarista', '5,0'], ['João', 'Encanador', '4,8'], ['Lúcia', 'Montadora', '5,0'], ['Marcos', 'Pintor', '4,7']];
let cv, ctx, src, sctx;
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
window.CLIPE = {
  dur: 5,
  async montar(palco) {
    palco.style.background = '#000';
    await document.fonts.load("700 80px 'Spline Sans'");
    cv = el('canvas', 'position:absolute;left:0;top:0', palco);
    cv.width = W; cv.height = H; ctx = cv.getContext('2d');
    src = document.createElement('canvas'); src.width = W; src.height = H; sctx = src.getContext('2d');
  },
  quadro(t) {
    /* cena: fundo azul e cards que oscilam; a marca aparece dentro da cena em 3,0–3,6 */
    const s = sctx;
    const g = s.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0a1440'); g.addColorStop(1, '#000');
    s.fillStyle = g; s.fillRect(0, 0, W, H);
    perfil.forEach(([n, o, nota], i) => {
      const x = 130 + i * 340 + 40 * Math.sin(t * 2 * Math.PI / 5 + i * 1.3);
      const y = 300 + 60 * Math.sin(t * 2 * Math.PI / 5 * 0.5 + i);
      s.fillStyle = i === 1 ? cores.azul : '#131624';
      rr(s, x, y, 300, 420, 36); s.fill();
      s.fillStyle = '#fff'; s.font = "700 64px 'Spline Sans', sans-serif"; s.fillText(n, x + 36, y + 300);
      s.fillStyle = cores.cinza; s.font = "500 34px 'Spline Sans', sans-serif"; s.fillText(o, x + 36, y + 350);
      s.fillStyle = cores.verde; s.fillText('★ ' + nota, x + 36, y + 390);
    });
    const ma = p(t, 3.0, 3.6);
    if (ma > 0) {
      s.globalAlpha = ma; s.font = "700 150px 'Spline Sans', sans-serif"; s.textBaseline = 'middle';
      const wT = s.measureText('Task').width, wG = s.measureText('GO').width, x0 = (W - wT - wG) / 2;
      s.fillStyle = '#fff'; s.fillText('Task', x0, 930); s.fillStyle = cores.azul; s.fillText('GO', x0 + wT, 930);
      s.globalAlpha = 1;
    }
    /* vidro: canelas se deslocam (deriva 0,04 UV/s) e o deslocamento se desfaz entre 3,9 s e 4,6 s */
    const forca = 1 - p(t, 3.9, 4.6);
    ctx.clearRect(0, 0, W, H);
    for (let x = 0; x < W; x += 4) {
      const xn = x / W;
      const f = (xn * CANELAS + t * DERIVA * CANELAS) % 1;
      const n = (f < 0 ? f + 1 : f) * 2 - 1;
      const sx = Math.min(W - 4, Math.max(0, x + n * DESLOC * W * forca));
      ctx.drawImage(src, sx, 0, 4, H, x, 0, 4, H);
      const sombra = 0.2 * n * n * forca;
      if (sombra > 0.005) { ctx.fillStyle = `rgba(0,0,0,${sombra})`; ctx.fillRect(x, 0, 4, H); }
    }
  }
};
</script></body></html>
