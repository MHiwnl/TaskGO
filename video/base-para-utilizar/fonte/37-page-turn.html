<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>37 · page turn</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: page-turn (página virando em 3D). Cada folha gira em torno da borda esquerda com rotateY;
   a frente e o verso ficam em faces com backface-visibility, e uma sombra escurece a cena de baixo.
   Pedido → aceito → marca, com uma folha por transição. */
const { p, inOutCubic, el, cores } = M;
let folha1, folha2, sombra1, sombra2, cartaoB, marca;

const pedido = `
<div style="position:absolute;left:160px;top:200px;font-size:30px;letter-spacing:6px;font-weight:700;color:${cores.azul}">NOVO PEDIDO</div>
<div style="position:absolute;left:160px;top:260px;width:1500px;font-size:120px;font-weight:700;letter-spacing:-4px;line-height:1.05">Preciso de um eletricista</div>
<div style="position:absolute;left:160px;top:560px;width:1000px;height:320px;border-radius:28px;background:#0e0f14;border:1px solid #23263a;box-sizing:border-box;padding:44px 48px">
  <div style="font-size:44px;font-weight:600">Troca de chuveiro</div>
  <div style="font-size:30px;color:${cores.cinza};margin-top:12px">Hoje, 16h · Vila Mariana</div>
  <div style="position:absolute;left:48px;bottom:44px;height:80px;line-height:80px;padding:0 40px;border-radius:999px;background:${cores.azul};font-size:32px;font-weight:700">Enviar pedido</div>
</div>`;

const aceito = `
<div style="position:absolute;left:160px;top:200px;font-size:30px;letter-spacing:6px;font-weight:700;color:${cores.azul}">PEDIDO ACEITO</div>
<div style="position:absolute;left:160px;top:260px;width:1500px;font-size:120px;font-weight:700;letter-spacing:-4px;color:#000">Carlos aceitou</div>
<div class="cartao" style="position:absolute;left:160px;top:560px;width:1000px;height:320px;border-radius:28px;background:#fff;border:1px solid #d9dce6;box-shadow:0 30px 60px rgba(0,0,0,.12);box-sizing:border-box;padding:44px 48px;color:#000">
  <div style="display:flex;gap:28px;align-items:center">
    <div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,${cores.azul},${cores.azulClaro});display:grid;place-items:center;font-size:52px;font-weight:700;color:#fff">C</div>
    <div><div style="font-size:44px;font-weight:700">Carlos · Eletricista</div><div style="font-size:30px;color:#555;margin-top:8px">★ 4,9 · 128 serviços</div></div>
  </div>
  <div style="position:absolute;right:48px;bottom:44px;height:80px;line-height:80px;padding:0 40px;border-radius:999px;background:${cores.azul};font-size:32px;font-weight:700;color:#fff">Pagar por Pix</div>
</div>`;

const marcaHtml = `<div class="marca" style="position:absolute;left:0;top:380px;width:100%;text-align:center;font-size:260px;font-weight:700;letter-spacing:-10px;line-height:1;color:#fff">Task<span style="color:${cores.azul}">GO</span></div>`;

/* folha com frente e verso; gira em torno da borda esquerda */
function folha(pai, frente, fundoFrente) {
  const f = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 50%;transform-style:preserve-3d', pai);
  el('div', `position:absolute;inset:0;overflow:hidden;background:${fundoFrente};backface-visibility:hidden`, f, frente);
  el('div', `position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#1a3fd6,#0b1a66);backface-visibility:hidden;transform:rotateY(180deg)`, f,
    `<div style="position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:4px solid rgba(255,255,255,.35)"></div>`);
  return f;
}

window.CLIPE = {
  dur: 5,
  montar(palco) {
    palco.style.background = '#000';
    marca = el('div', 'position:absolute;inset:0;background:#000;overflow:hidden', palco, marcaHtml);
    sombra2 = el('div', 'position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),transparent 70%);opacity:0', palco);
    const persp = el('div', 'position:absolute;inset:0;perspective:2400px', palco);
    folha2 = folha(persp, aceito, '#f4f5f8');
    sombra1 = el('div', 'position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),transparent 70%);opacity:0', persp);
    folha1 = folha(persp, pedido, '#08080a');
    cartaoB = folha2.querySelector('.cartao');
    marca = palco.querySelector('.marca');
  },
  quadro(t) {
    /* 1.0–2.0 a folha do pedido vira (revela o perfil) · 3.0–4.0 a folha do perfil vira (revela a marca) */
    const g1 = 180 * inOutCubic(p(t, 1.0, 2.0)), g2 = 180 * inOutCubic(p(t, 3.0, 4.0));
    folha1.style.transform = `rotateY(${(-g1).toFixed(3)}deg)`;
    folha2.style.transform = `rotateY(${(-g2).toFixed(3)}deg)`;
    sombra1.style.opacity = (0.6 * Math.sin(g1 * Math.PI / 180)).toFixed(4);
    sombra2.style.opacity = (0.6 * Math.sin(g2 * Math.PI / 180)).toFixed(4);
    cartaoB.style.transform = `translateY(${(Math.sin(t * 1.6) * 8).toFixed(2)}px)`;
    marca.style.transform = `scale(${(1 + 0.03 * p(t, 4.0, 5)).toFixed(4)})`;
  }
};
</script></body></html>
