<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>19 · slides de apresentação</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: apresentação em 4 slides de 1,1 s com transições diferentes: máscara circular, push,
   zoom atravessando e cubo 3D. Títulos e tópicos entram em cascata. Último slide é a marca. */
const { p, lerp, outExpo, outCubic, mola, el, cores } = M;
const DUR = 1.1;
const SLIDES = [
  { bg: '#0a0c14', titulo: 'Achar serviço local é difícil', itens: ['Indicação no grupo do bairro se perde', 'Preço combinado no escuro', 'Nenhuma nota para escolher'] },
  { bg: cores.azul, titulo: 'TaskGO conecta quem precisa a quem faz', itens: ['Pedido em um toque', 'Profissionais com avaliação', 'Pagamento pelo Pix'] },
  { bg: '#000', titulo: 'Como funciona', passos: ['Pede', 'Aceita', 'Paga', 'Avalia'] },
  { bg: '#000', marca: true }
];
let stage, slides = [];

window.CLIPE = {
  dur: 5,
  montar(palco) {
    stage = el('div', 'position:absolute;inset:0;perspective:2400px', palco);
    SLIDES.forEach((s, k) => {
      const n = el('div', `position:absolute;inset:0;overflow:hidden;background:${s.bg};opacity:0`, stage);
      const conteudo = el('div', 'position:absolute;inset:0;padding:260px 180px 0;box-sizing:border-box', n);
      const itens = [];
      if (s.marca) {
        const m = el('div', 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:360px;font-weight:700;letter-spacing:-14px;color:#fff', conteudo, 'Task<span style="color:#2b59ff">GO</span>');
        itens.push(m);
      } else {
        const tit = el('div', 'font-size:132px;font-weight:700;letter-spacing:-5px;line-height:1.1;color:#fff', conteudo, s.titulo);
        itens.push(tit);
        (s.itens || []).forEach(txt => itens.push(el('div', 'font-size:58px;font-weight:500;margin-top:40px;color:#fff;padding-left:50px;border-left:10px solid #2b59ff', conteudo, txt)));
        if (s.passos) {
          const linha = el('div', 'position:absolute;left:180px;right:180px;top:560px;display:flex;gap:30px', conteudo);
          s.passos.forEach((w, j) => itens.push(el('div', 'flex:1;height:320px;border-radius:36px;background:#0e0f14;border:2px solid #23263a;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:700;color:#fff', linha, `${j + 1}<br>${w}`)));
        }
      }
      slides.push({ n, itens, k });
    });
  },
  quadro(t) {
    const cur = Math.min(SLIDES.length - 1, Math.floor(t / DUR));
    slides.forEach((s, i) => {
      const e = p(t, cur * DUR, cur * DUR + 0.4); // entrada do slide atual
      const x = p(t, cur * DUR, cur * DUR + 0.4); // saída do anterior
      let vis = i === cur ? 1 : (i === cur - 1 ? 1 : 0);
      s.n.style.opacity = vis;
      s.n.style.zIndex = i === cur ? 2 : 1;
      s.n.style.transform = 'none';
      s.n.style.clipPath = 'none';
      if (i === cur) {
        const ek = outCubic(e);
        if (cur === 0) s.n.style.clipPath = `circle(${lerp(0, 150, outCubic(e))}% at 50% 50%)`;
        if (cur === 1) s.n.style.transform = `translateX(${lerp(1920, 0, ek)}px)`;
        if (cur === 2) { s.n.style.transform = `scale(${lerp(0.2, 1, outExpo(e))})`; s.n.style.opacity = e; }
        if (cur === 3) { s.n.style.transformOrigin = '0 50%'; s.n.style.transform = `rotateY(${lerp(90, 0, ek)}deg)`; }
      } else if (i === cur - 1) {
        const ek = outCubic(x);
        if (cur === 1) s.n.style.transform = `translateX(${lerp(0, -1920, ek)}px)`;
        if (cur === 2) { s.n.style.transform = `scale(${lerp(1, 2.4, ek)})`; s.n.style.opacity = 1 - x; }
        if (cur === 3) { s.n.style.transformOrigin = '100% 50%'; s.n.style.transform = `rotateY(${lerp(0, -90, ek)}deg)`; }
      }
      /* conteúdo entra em cascata a partir do começo de cada slide */
      const u = t - i * DUR;
      if (i === cur) s.itens.forEach((el2, j) => {
        const m = mola(u - 0.25 - j * 0.12, 2.2, 5);
        el2.style.opacity = Math.max(0, Math.min(1, m));
        el2.style.transform = `translateY(${(1 - Math.max(0, Math.min(1.2, m))) * 90}px)`;
        if (s.passos || SLIDES[i].marca) el2.style.filter = `blur(${(1 - Math.min(1, Math.max(0, m))) * 10}px)`;
      });
    });
  }
};
</script></body></html>
