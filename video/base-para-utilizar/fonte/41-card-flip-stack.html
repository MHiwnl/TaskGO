<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>41 · pilha de cards que viram</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: card-flip-stack (cartões que viram em sequência e se empilham para trás, o escolhido fica na frente).
   Aqui: cinco profissionais em cartões; quatro viram e recuam, o escolhido (azul) sobe, aceita o pedido e a marca entra. */
const { p, lerp, outExpo, outBack, inOutCubic, mola, el, cores } = M;
const perfil = [['Carlos', 'Eletricista', '4,9'], ['Ana', 'Diarista', '5,0'], ['João', 'Encanador', '4,8'], ['Marcos', 'Pintor', '4,7'], ['Lúcia', 'Montadora', '5,0']];
const cards = [];
let stack, marca, simbolo, brilho;
window.CLIPE = {
  dur: 5,
  montar(palco) {
    palco.style.background = 'radial-gradient(ellipse at 50% 40%, #0b1a55 0%, #000 65%)';
    brilho = el('div', 'position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px;border-radius:50%;background:radial-gradient(circle,rgba(43,89,255,.45),transparent 60%);filter:blur(30px)', palco);
    stack = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1400px;transform-style:preserve-3d', palco);
    perfil.forEach(([n, o, s], i) => {
      const escolhido = i === 4;
      cards[i] = el('div', `position:absolute;left:660px;top:250px;width:600px;height:580px;border-radius:36px;transform-origin:50% 100%;background:${escolhido ? cores.azul : '#0e0f14'};border:2px solid ${escolhido ? cores.azulClaro : '#23263a'};display:flex;flex-direction:column;justify-content:space-between;padding:56px;box-sizing:border-box;will-change:auto`, stack,
        `<div style="width:150px;height:150px;border-radius:50%;background:${escolhido ? '#fff' : cores.azul};color:${escolhido ? cores.azul : '#fff'};display:grid;place-items:center;font-size:72px;font-weight:700">${n[0]}</div>
         <div><div style="font-size:72px;font-weight:700;letter-spacing:-2px">${n}</div><div style="font-size:36px;color:${escolhido ? '#dfe6ff' : cores.cinza};margin-top:8px">${o} · ★ ${s}</div></div>
         <div style="font-size:34px;color:${escolhido ? '#fff' : cores.cinza}">${escolhido ? 'Pedido aceito' : 'Disponível hoje'}</div>`);
    });
    simbolo = el('img', 'position:absolute;left:960px;top:330px;width:170px;margin-left:-85px;opacity:0', palco); simbolo.src = M.simbolo;
    marca = el('div', 'position:absolute;left:0;width:100%;top:500px;text-align:center;font-size:150px;font-weight:700;letter-spacing:-5px;opacity:0', palco, 'Task<span style="color:#2b59ff">GO</span>');
  },
  quadro(t) {
    /* cartões 0–3: viram (rotateX -115°, 0,65 s) e recuam para o fundo da pilha; passo de 0,18 s */
    for (let i = 0; i < 4; i++) {
      const s = 0.38 + i * 0.18;
      const a1 = inOutCubic(p(t, s, s + 0.65)), a2 = inOutCubic(p(t, s + 0.65, s + 1.4));
      const z0 = 65 * (4 - i), zf = -420 - i * 55;
      const rx = -115 * a1 + 93 * a2;
      const z = lerp(z0, 90, a1) + (zf - 90) * a2;
      const y = -145 * a1 + (-115 - i * 16 + 145) * a2;
      cards[i].style.transform = `translate3d(0px,${y}px,${z}px) rotateX(${rx}deg)`;
      cards[i].style.filter = `brightness(${1 - 0.35 * a2})`;
    }
    /* cartão 4 (escolhido) fica no fundo e sobe à frente entre 1,1 s e 1,8 s, com mola */
    const sobe = outExpo(p(t, 1.1, 1.8)), pop = mola(t - 1.1, 2.4, 6);
    cards[4].style.transform = `translate3d(0px,${(1 - sobe) * 60}px,${(1 - sobe) * -80}px) scale(${lerp(0.92, 1, pop)})`;
    cards[4].style.boxShadow = `0 0 ${80 * sobe}px rgba(43,89,255,${0.6 * sobe})`;
    brilho.style.transform = `scale(${0.6 + 0.4 * sobe})`;
    brilho.style.opacity = sobe;
    /* 3,2–3,8 a pilha se dissolve, 3,5–4,2 o símbolo entra com retorno, 4,0–4,6 a marca surge */
    const some = 1 - inOutCubic(p(t, 3.2, 3.8));
    stack.style.opacity = some;
    simbolo.style.opacity = p(t, 3.5, 4.0);
    simbolo.style.transform = `translateY(${(1 - outBack(p(t, 3.5, 4.2))) * 120}px) scale(${lerp(0.4, 1, outBack(p(t, 3.5, 4.2)))})`;
    marca.style.opacity = p(t, 4.0, 4.5);
    marca.style.transform = `translateY(${(1 - outExpo(p(t, 4.0, 4.6))) * 60}px)`;
    brilho.style.opacity = sobe * (1 - 0.6 * p(t, 3.6, 4.4));
  }
};
</script></body></html>
