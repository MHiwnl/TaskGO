<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>17 · mapa do bairro</title>
<script src="../../onetake/font.js"></script>
<script src="base.js"></script></head><body>
<script>
/* Referência: mapa estilizado visto de cima com câmera inclinada (rotateX) e leve balanço. Profissionais caem
   com mola e pulsam ao pousar; a rota tracejada se desenha até a casa do cliente e o carro percorre. */
const { p, lerp, outExpo, outCubic, inOutCubic, outBack, mola, el, cores } = M;
let cam, hud, eta, cartao, marca;
const PROS = [
  { x: 560, y: 380, ini: 'C' }, { x: 1300, y: 380, ini: 'A', escolhida: true },
  { x: 1560, y: 760, ini: 'J' }, { x: 320, y: 760, ini: 'M' }
];
const CASA = { x: 960, y: 620 };
const ROTA = [[1300, 380], [1300, 620], [960, 620]];
const TRAJ = 240 + 340;
const ruas = [180, 380, 620, 760, 900];
const avenidas = [320, 560, 960, 1300, 1560];

function pontoRota(f) {
  const L = f * TRAJ;
  return L <= 240 ? [1300, 380 + L] : [1300 - (L - 240), 620];
}

window.CLIPE = {
  dur: 5,
  montar(palco) {
    palco.style.background = 'radial-gradient(ellipse at 50% 60%, #14204a 0%, #000 70%)';
    cam = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 60%', palco);
    const ruasSvg = ruas.map(y => `<line x1="-40" y1="${y}" x2="1960" y2="${y}" stroke="#1f2d5c" stroke-width="34"/>`).join('') +
      avenidas.map(x => `<line x1="${x}" y1="-40" x2="${x}" y2="1120" stroke="#1f2d5c" stroke-width="34"/>`).join('');
    const quarteiroes = [[380, 210, 220, 130], [620, 430, 280, 150], [1080, 420, 180, 160], [1380, 210, 150, 120], [1620, 430, 230, 170], [1100, 800, 260, 180], [640, 800, 240, 150], [120, 430, 130, 240]]
      .map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#101a3d"/>`).join('');
    const parques = [[660, 452, 190, 100], [1120, 880, 120, 90]].map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#123b35"/>`).join('');
    const pinos = PROS.map((pr, i) => `<ellipse id="sh${i}" cx="${pr.x}" cy="${pr.y + 40}" rx="44" ry="14" fill="#000" opacity="0.55"/>`).join('');
    const aneis = PROS.map((pr, i) => `<circle id="rg${i}" cx="${pr.x}" cy="${pr.y}" r="40" fill="none" stroke="#8aa3ff" stroke-width="5" opacity="0"/>`).join('');
    const pinosG = PROS.map((pr, i) => `<g id="pn${i}" transform="translate(${pr.x},${pr.y})"><circle id="pc${i}" r="34" fill="${cores.azul}" stroke="#fff" stroke-width="6"/><text y="12" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">${pr.ini}</text></g>`).join('');
    const casa = `<rect id="casa" x="${CASA.x - 28}" y="${CASA.y - 28}" width="56" height="56" rx="12" fill="#fff" transform="rotate(45 ${CASA.x} ${CASA.y})" opacity="0"/>`;
    el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px', cam, `<svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;left:0;top:0;overflow:visible">
${quarteiroes}${parques}
<g>${ruasSvg}</g>
<path id="rio" d="M-40 880 C 500 760, 900 1000, 1960 820" fill="none" stroke="#173a8a" stroke-width="130" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<path d="M-40 880 C 500 760, 900 1000, 1960 820" fill="none" stroke="#2b59ff" stroke-width="6" stroke-dasharray="18 22" opacity="0.5"/>
<path id="rota" d="M${ROTA.map(r => r.join(' ')).join(' L')}" fill="none" stroke="#8aa3ff" stroke-width="8" stroke-dasharray="1 0" pathLength="1" stroke-linecap="round" stroke-linejoin="round"/>
${pinos}${aneis}${casa}${pinosG}
<circle id="carro" r="20" fill="${cores.verde}" stroke="#fff" stroke-width="5" opacity="0"/>
</svg>`);
    hud = el('div', 'position:absolute;left:120px;top:90px;padding:22px 36px;border-radius:999px;background:#0e0f14;border:1px solid #23263a;font-size:44px;font-weight:600;opacity:0', palco);
    hud.innerHTML = 'chega em <span style="color:#8aa3ff" id="eta">0</span> min';
    eta = hud.querySelector('#eta');
    cartao = el('div', 'position:absolute;left:120px;bottom:120px;width:620px;height:150px;border-radius:28px;background:#0e0f14;border:1px solid #2b59ff;box-shadow:0 0 50px rgba(43,89,255,.45);display:flex;align-items:center;gap:24px;padding:0 28px', palco,
      `<div style="width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,${cores.azul},${cores.azulClaro});display:grid;place-items:center;font-size:38px;font-weight:700">A</div>
       <div><div style="font-size:36px;font-weight:600">Ana</div><div style="font-size:26px;color:${cores.cinza}">Eletricista · ★ 5,0</div></div>`);
    marca = el('div', 'position:absolute;left:0;width:100%;top:440px;text-align:center;font-size:170px;font-weight:700;letter-spacing:-6px;opacity:0', palco, 'Task<span style="color:#2b59ff">GO</span>');
  },
  quadro(t) {
    const rx = lerp(8, 50, outExpo(p(t, 0, 1.6)));
    const rz = Math.sin(t * 0.7) * 4;
    const s = lerp(0.9, 1, outCubic(p(t, 0, 1.6)));
    cam.style.transform = `perspective(2400px) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`;
    cam.style.opacity = 1 - 0.8 * p(t, 4.3, 4.7);
    q('rio').setAttribute('stroke-dashoffset', 1 - outCubic(p(t, 0.3, 1.3)));
    /* profissionais caem com mola em cascata; sombra cresce ao pousar; pulso contínuo depois */
    PROS.forEach((pr, i) => {
      const st = 1.0 + i * 0.12;
      const k = mola(t - st, 2.2, 5);
      q('pn' + i).setAttribute('transform', `translate(${pr.x},${pr.y - (1 - k) * 700})`);
      const sh = q('sh' + i);
      sh.setAttribute('opacity', 0.55 * Math.max(0, Math.min(1, k)));
      sh.setAttribute('transform', `translate(0,0) scale(${Math.max(0, Math.min(1, k))})`);
      sh.setAttribute('style', `transform-origin:${pr.x}px ${pr.y + 40}px`);
      const ring = q('rg' + i);
      if (t > st + 0.3) {
        const ph = ((t - st - 0.3) % 1.3) / 1.3;
        ring.setAttribute('r', 40 + ph * 140);
        ring.setAttribute('opacity', 1 - ph);
      }
      if (pr.escolhida && t > 3.0) q('pc' + i).setAttribute('fill', cores.verde);
    });
    /* casa do cliente aparece com pulso; rota desenha; carro percorre; ETA conta */
    const ca = q('casa');
    ca.setAttribute('opacity', p(t, 2.2, 2.5));
    ca.setAttribute('transform', `rotate(${45 * outBack(p(t, 2.2, 2.7))} ${CASA.x} ${CASA.y})`);
    q('rota').setAttribute('stroke-dashoffset', 1 - outCubic(p(t, 2.6, 3.6)));
    const f = inOutCubic(p(t, 3.6, 4.6));
    const [cx, cy] = pontoRota(f);
    const carro = q('carro');
    carro.setAttribute('cx', cx); carro.setAttribute('cy', cy);
    carro.setAttribute('opacity', p(t, 3.5, 3.7) * (1 - p(t, 4.6, 4.8)));
    hud.style.opacity = p(t, 0.2, 0.6) * (1 - p(t, 4.3, 4.6));
    eta.textContent = Math.round(12 * outCubic(p(t, 2.6, 4.2)));
    cartao.style.transform = `translateX(${lerp(-800, 0, outBack(p(t, 3.2, 3.7)))}px)`;
    cartao.style.opacity = p(t, 3.2, 3.4);
    marca.style.opacity = p(t, 4.4, 4.8);
    marca.style.transform = `scale(${lerp(1.2, 1, outBack(p(t, 4.4, 4.9)))})`;
  }
};
function q(id) { return document.getElementById(id); }
</script></body></html>
