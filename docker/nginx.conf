# Serve o site e repassa a API pelo mesmo endereço, sem CORS nem configuração no frontend.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Desenvolvimento: sempre a versão mais recente dos arquivos.
    add_header Cache-Control "no-store" always;

    # Cabecalhos de seguranca (clickjacking, MIME sniffing, CSP, referer, permissoes).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com https://*.gstatic.com https://*.googleusercontent.com https://accounts.google.com; connect-src 'self' https://router.project-osrm.org https://nominatim.openstreetmap.org https://viacep.com.br https://accounts.google.com; frame-src https://accounts.google.com" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;


    # Arquivos e caminhos que robôs procuram (.git, .env, configurações, painéis de outros sistemas): sempre "não encontrado".
    location ~ /\. { return 404; }
    location ~* \.(env|ini|log|sql|sqlite|bak|old|orig|swp|yml|yaml|toml|conf|config|pem|key|map)$ { return 404; }
    location ~* ^/(env\.js|config\.js|configuration\.php|graphql|graphiql|wp-admin|wp-login\.php|wp-content|xmlrpc\.php|phpmyadmin|pma|server-status|cgi-bin|vendor|node_modules|cmd_sco|backend|backup|backups|docker)(/|$) { return 404; }
    location ^~ /actuator/ { return 404; }

    # Tempo real (SSE): sem buffer e com conexão longa.
    location = /api/eventos {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location = /actuator/health {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
