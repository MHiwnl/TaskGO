server.port=${PORT:8080}
# Atrás do nginx: o IP de quem acessa vem do X-Forwarded-For (só de proxies da rede interna). Sem isto, os limitadores por IP viam um IP só para todos.
server.forward-headers-strategy=native
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Pool (HikariCP): conexões reaproveitadas, nunca abertas por requisição.
# Ociosa além do mínimo fecha após 5 min; nenhuma vive mais de 25 min (abaixo dos cortes de proxy/NAT comuns).
spring.datasource.hikari.pool-name=taskgo-pool
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:240000}
# Pool cheio: a requisição espera no máximo 10 s e falha, em vez de empilhar e travar o banco.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
# Registra no log conexão presa por mais de 60 s (vazamento).
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:60000}
# O próprio Postgres encerra sessão parada dentro de transação aberta há mais de 60 s.
spring.datasource.hikari.data-source-properties.options=-c idle_in_transaction_session_timeout=${DB_IDLE_IN_TX_TIMEOUT_MS:60000}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
taskgo.cors.allowed-origins=${TASKGO_CORS_ALLOWED_ORIGINS}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}

# Configure estas integrações somente ao habilitar os recursos correspondentes.
# Pagamento: desligado (pedido vai direto ao mural) ou simulado (Pix pelo simulador e cartão simulado).
taskgo.pagamentos.modo=${TASKGO_PAGAMENTOS_MODO:desligado}
taskgo.pagamentos.taxa=${TASKGO_PAGAMENTOS_TAXA:0.15}
# direto: o cliente paga quem atende (Pix na chave dele ou dinheiro) e só a taxa passa pela TaskGO. retido: a TaskGO segura o valor até confirmar.
taskgo.pagamentos.modelo=${TASKGO_PAGAMENTOS_MODELO:retido}
taskgo.pagamentos.pix.url=${PIX_API_URL:http://pix:3100}
taskgo.pagamentos.pix.webhook-token=${PIX_WEBHOOK_TOKEN:}
# Asaas (modo asaas): URL (sandbox por padrão; produção: https://api.asaas.com/v3), chave da API e token do webhook.
taskgo.pagamentos.asaas.url=${ASAAS_API_URL:https://api-sandbox.asaas.com/v3}
taskgo.pagamentos.asaas.api-key=${ASAAS_API_KEY:}
taskgo.pagamentos.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}

# Entrar com Google: ID do cliente OAuth (Google Cloud). Vazio = botão escondido.
taskgo.google.client-id=${GOOGLE_CLIENT_ID:}
# Endereço público do site (links dos e-mails de aviso). Vazio = usa o endereço da recuperação de senha.
taskgo.site.url=${TASKGO_SITE_URL:}

# Administradores (moderação e recursos): e-mails separados por vírgula.
taskgo.admin.emails=${TASKGO_ADMIN_EMAILS:}
# Equipe de suporte (recebe os chamados de emergência): e-mails separados por vírgula.
taskgo.suporte.emails=${TASKGO_SUPORTE_EMAILS:}
# Senha nova é conferida na lista de senhas vazadas (Have I Been Pwned, só 5 letras do hash saem do servidor).
taskgo.senha.verificar-vazamentos=${TASKGO_SENHA_VERIFICAR_VAZAMENTOS:true}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
taskgo.mail.from=${SMTP_FROM:}
# Caixa que recebe as mensagens do formulário de contato.
taskgo.contato.email=${TASKGO_CONTATO_EMAIL:taskgo.adm@gmail.com}
# Verificação de identidade exigida para o cliente fazer pedidos e para o profissional receber oportunidades.
taskgo.verificacao.obrigatoria=${TASKGO_VERIFICACAO_OBRIGATORIA:true}
taskgo.auth.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:}

# Erros de regra (ResponseStatusException) saem como ProblemDetail com o texto em "detail" para o site mostrar.
spring.mvc.problemdetails.enabled=true
# Sessões no banco (tabelas criadas pela migração V8).
spring.session.jdbc.initialize-schema=never

# Cadastro: CPF com dígito válido e único (um CPF por conta). Desligue nos testes.
taskgo.cadastro.validar-cpf=${TASKGO_CADASTRO_VALIDAR_CPF:true}

# SMS: desligado | log (simula) | http (provedor em TASKGO_SMS_URL com TASKGO_SMS_TOKEN). Desligado por padrão.
taskgo.sms.modo=${TASKGO_SMS_MODO:desligado}
taskgo.sms.url=${TASKGO_SMS_URL:}
taskgo.sms.token=${TASKGO_SMS_TOKEN:}
# Tarefas agendadas em paralelo: a conferência do Pix do plano (a cada 5 s) não segura as outras.
spring.task.scheduling.pool.size=${TASKGO_AGENDADOR_THREADS:4}
